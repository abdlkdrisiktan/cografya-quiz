<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Türkiye Coğrafya Oyunu - Geçitler, Sınır Kapıları, Boru Hatları</title>
<style>
  :root{
    --red:#c81e2c;
    --red-dark:#9c1620;
    --cream:#faf6ec;
    --map-fill:#eee3c8;
    --map-stroke:#a9895f;
    --ink:#2c2620;
    --tunnel:#2b6f8f;
    --border-gate:#3c7a3f;
    --lake:#1a7fb0;
    --mountain:#7a5230;
    --plain:#8a9a3b;
    --dam:#6b4fa0;
    --wrong:#c81e2c;
    --correct:#2f8f4e;
    --card:#ffffff;
    --shadow: 0 6px 18px rgba(44,38,32,0.15);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:linear-gradient(180deg,#fbf7ee 0%,#f3ecd8 100%);
    color:var(--ink);
    -webkit-tap-highlight-color: transparent;
    user-select:none;
    overscroll-behavior:none;
  }
  #app{max-width:1000px;margin:0 auto;padding:14px 14px 30px;min-height:100%;}
  h1{font-size:clamp(19px,3.2vw,27px);margin:6px 0 2px;color:var(--red-dark);text-align:center;}
  .subtitle{text-align:center;color:#6b5f4f;margin:0 0 4px;font-size:14px;}
  .motivation-line{
    text-align:center;color:#a15b1f;font-size:13.5px;font-style:italic;margin:0 0 16px;
    background:#fff6e0;border:1px dashed #e6c98a;border-radius:10px;padding:8px 12px;
  }
  .note-btn{
    display:block;width:100%;padding:12px;border:2px dashed #e08a9b;border-radius:14px;
    background:#fff0f4;color:#c23c66;font-size:15px;font-weight:700;cursor:pointer;margin-top:10px;
  }
  .note-btn:active{transform:scale(0.98);}
  .note-modal-box{text-align:center;}
  .note-heart{font-size:40px;margin-bottom:6px;animation:heart-beat 1.4s ease-in-out infinite;}
  @keyframes heart-beat{0%,100%{transform:scale(1);}50%{transform:scale(1.15);}}
  .note-text{font-size:15.5px;line-height:1.7;color:#4a3a2e;text-align:left;white-space:pre-line;margin-bottom:6px;}
  .streak-banner{
    margin-top:10px;padding:8px 12px;border-radius:10px;background:#fff3d6;border:1.5px solid #f0c463;
    font-size:13.5px;font-weight:700;color:#9a6a00;text-align:center;
  }
  .confetti-wrap{position:relative;height:0;overflow:visible;}
  .confetti-piece{
    position:absolute; top:-10px; font-size:20px; animation: confetti-fall 2.6s ease-in forwards;
  }
  @keyframes confetti-fall{
    0%{ transform:translateY(0) rotate(0deg); opacity:1; }
    100%{ transform:translateY(220px) rotate(360deg); opacity:0; }
  }
  .card{
    background:var(--card);border-radius:18px;box-shadow:var(--shadow);
    padding:18px;margin-bottom:16px;
  }
  .hidden{display:none !important;}

  /* START SCREEN */
  .option-group{margin-bottom:16px;}
  .option-group label.group-title{display:block;font-weight:700;margin-bottom:8px;font-size:15px;color:var(--red-dark);}
  .pill-row{display:flex;flex-wrap:wrap;gap:8px;}
  .pill{
    border:2px solid #d8cba8;background:#fff;padding:12px 16px;border-radius:999px;
    font-size:14.5px;cursor:pointer;font-weight:600;color:var(--ink);
    transition:all .15s ease;
  }
  .pill.active{background:var(--red);border-color:var(--red);color:#fff;}
  .pill:active{transform:scale(0.96);}
  .family-pill{font-size:16px;padding:16px 18px;flex:1;min-width:220px;text-align:center;}
  .big-btn{
    display:block;width:100%;padding:16px;border:none;border-radius:14px;
    background:var(--red);color:#fff;font-size:18px;font-weight:700;
    cursor:pointer;margin-top:6px;box-shadow:0 4px 0 var(--red-dark);
  }
  .big-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--red-dark);}
  .secondary-btn{
    display:block;width:100%;padding:13px;border:2px solid var(--red);border-radius:14px;
    background:#fff;color:var(--red);font-size:16px;font-weight:700;cursor:pointer;margin-top:10px;
  }
  .legend{display:flex;gap:16px;justify-content:center;margin-top:10px;font-size:12.5px;color:#6b5f4f;flex-wrap:wrap;}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .dot{width:12px;height:12px;border-radius:50%;display:inline-block;}
  .swatch{width:18px;height:5px;border-radius:3px;display:inline-block;}

  /* GAME HEADER */
  .game-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px;}
  .score-box{font-weight:700;font-size:15px;background:#fff;padding:8px 14px;border-radius:12px;box-shadow:var(--shadow);}
  .progress-wrap{flex:1;min-width:120px;height:10px;background:#e6dcc0;border-radius:6px;overflow:hidden;margin:0 10px;}
  .progress-bar{height:100%;background:var(--red);width:0%;transition:width .3s ease;}
  .quit-btn{background:none;border:none;font-size:22px;cursor:pointer;color:#8a7c63;padding:4px 8px;}

  .question-banner{
    text-align:center;padding:12px;border-radius:14px;background:#fff8e6;border:2px dashed #d8bf7c;
    margin-bottom:6px;font-size:16.5px;font-weight:700;color:var(--red-dark);
  }
  .question-hint{text-align:center;font-size:12.5px;color:#8a7c63;margin-bottom:10px;}
  .question-banner .cat-tag{
    display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;
    margin-left:8px;vertical-align:middle;color:#fff;
  }
  .tag-tunnel{background:var(--tunnel);}
  .tag-border{background:var(--border-gate);}
  .tag-lake{background:var(--lake);}
  .tag-mountain{background:var(--mountain);}
  .tag-plain{background:var(--plain);}
  .tag-dam{background:var(--dam);}
  .tag-oil{background:#a0522d;}
  .tag-gas{background:#1f6fb2;}

  /* MAP */
  .map-wrap{position:relative;background:#eaf4f8;border-radius:16px;overflow:hidden;box-shadow:var(--shadow);}
  svg#mapSvg{display:block;width:100%;height:auto;touch-action:manipulation;}
  .tr-shape{fill:var(--map-fill);stroke:var(--map-stroke);stroke-width:2.2;}
  .sea-bg{fill:#bfe0ea;}
  .neighbor-shape{fill:#e4ddc9;stroke:#c9bd9e;stroke-width:0.8;}
  .province-shape{stroke:#ffffff;stroke-width:1.1;filter:drop-shadow(0 1px 0.5px rgba(44,38,32,0.12));}
  .province-shape-colored{stroke:#ffffff;stroke-width:1;}
  .tr-outline-strong{fill:none;stroke:#3a342a;stroke-width:2.2;}
  .province-label{
    font-size:8px;fill:#2c2620;text-anchor:middle;dominant-baseline:middle;
    paint-order:stroke; stroke:#faf6ec; stroke-width:1.3px; stroke-linejoin:round;
    font-weight:700; pointer-events:none;
  }
  .marker{cursor:pointer;}
  .marker circle.dot-outer{fill:rgba(200,30,44,0.18);}
  .marker circle.dot-inner{fill:var(--red);stroke:#fff;stroke-width:1.5;}
  .marker.tunnel circle.dot-inner{fill:var(--tunnel);}
  .marker.border circle.dot-inner{fill:var(--border-gate);}
  .marker.lake circle.dot-inner{fill:var(--lake);}
  .marker.mountain circle.dot-inner{fill:var(--mountain);}
  .marker.plain circle.dot-inner{fill:var(--plain);}
  .marker.dam circle.dot-inner{fill:var(--dam);}
  .marker.correct-mark circle.dot-inner{fill:var(--correct);}
  .marker.wrong-mark circle.dot-inner{fill:var(--wrong);}
  .pulse{
    animation: pulse-anim 1.1s ease-out infinite;
    transform-origin:center;
  }
  @keyframes pulse-anim{
    0%{ transform:scale(1); opacity:0.9;}
    70%{ transform:scale(2.6); opacity:0;}
    100%{ transform:scale(2.6); opacity:0;}
  }
  .tap-x{stroke:#c81e2c;stroke-width:4;stroke-linecap:round;}

  /* PIPELINE LINES */
  .pipe-line{fill:none;stroke-linecap:round;stroke-linejoin:round;}
  .pipe-faint{stroke-width:4;opacity:0.35;}
  .pipe-active{stroke-width:6;opacity:1;}
  .pipe-flow{
    stroke-dasharray:9 7;
    animation: flow-anim 0.9s linear infinite;
  }
  @keyframes flow-anim{ to{ stroke-dashoffset:-32; } }
  .pipe-node{stroke:#fff;stroke-width:1.2;}
  .pipe-correct{stroke:var(--correct) !important;stroke-width:7 !important;opacity:1 !important;}
  .pipe-wrong-tap{stroke:var(--wrong) !important;}

  /* ANSWER OPTIONS */
  .options-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;}
  @media (max-width:520px){ .options-grid{grid-template-columns:1fr;} }
  .opt-btn{
    padding:16px 12px;border-radius:14px;border:2px solid #d8cba8;background:#fff;
    font-size:15.5px;font-weight:600;cursor:pointer;text-align:left;
  }
  .opt-btn:active{transform:scale(0.98);}
  .opt-btn.correct{background:#e4f7e9;border-color:var(--correct);color:#1c5c33;}
  .opt-btn.wrong{background:#fbe6e6;border-color:var(--wrong);color:#8f1520;}
  .opt-btn[disabled]{cursor:default;}

  /* FEEDBACK */
  .feedback-card{margin-top:14px;padding:16px;border-radius:14px;display:flex;gap:12px;align-items:flex-start;}
  .feedback-card.ok{background:#e4f7e9;border:2px solid var(--correct);}
  .feedback-card.bad{background:#fbe6e6;border:2px solid var(--wrong);}
  .feedback-icon{font-size:28px;line-height:1;}
  .feedback-title{font-weight:800;font-size:17px;margin:0 0 4px;}
  .feedback-text{margin:0;font-size:14.5px;line-height:1.45;color:#3a3226;}
  .feedback-route{margin:8px 0 0;font-size:13px;color:#6b5f4f;font-style:italic;}
  .continue-btn{margin-top:14px;}

  /* END SCREEN */
  .result-score{font-size:48px;font-weight:800;text-align:center;color:var(--red-dark);margin:6px 0;}
  .result-sub{text-align:center;color:#6b5f4f;margin-bottom:16px;}
  .review-list{margin-top:10px;}
  .review-item{
    display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:10px;
    background:#fbe6e6;margin-bottom:6px;font-size:14px;border-left:4px solid var(--wrong);
  }
  .review-item b{color:var(--red-dark);}

  /* INFO / REFERENCE MODAL */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(30,24,16,0.55);display:flex;align-items:flex-end;
    justify-content:center;z-index:50;
  }
  .modal-box{
    background:var(--cream);width:100%;max-width:640px;max-height:82vh;overflow-y:auto;
    border-radius:20px 20px 0 0;padding:18px;
  }
  .modal-box h2{margin-top:0;color:var(--red-dark);font-size:19px;}
  .ref-item{padding:10px 0;border-bottom:1px solid #e6dcc0;}
  .ref-item .rname{font-weight:700;font-size:15px;display:flex;align-items:center;gap:8px;}
  .ref-item .rdesc{font-size:13.5px;color:#5a5142;margin-top:2px;}
  .close-modal{
    display:block;width:100%;padding:13px;border:none;border-radius:12px;background:var(--red);
    color:#fff;font-weight:700;font-size:15px;margin-top:12px;cursor:pointer;
  }
  .ref-section-title{font-weight:800;color:var(--red-dark);margin:16px 0 6px;font-size:14px;text-transform:uppercase;letter-spacing:.5px;}
</style>
</head>
<body>
<div id="app">
  <h1>🇹🇷 Türkiye Coğrafya Oyunu</h1>
  <p class="subtitle">KPSS Coğrafya · Harita Üzerinden Görsel Hafıza Çalışması</p>
  <p class="motivation-line" id="motivationLine"></p>

  <!-- START SCREEN -->
  <div id="startScreen" class="card">
    <div class="option-group">
      <label class="group-title">1) Harita görünümü seç</label>
      <div class="pill-row" id="mapStylePills">
        <button class="pill map-style-pill active" data-style="plain">🗺️ Türkiye Haritası (sınırsız)</button>
        <button class="pill map-style-pill" data-style="political">🧩 Siyasi Harita (il sınırları, isimsiz)</button>
        <button class="pill map-style-pill" data-style="political_labeled">🏷️ Siyasi Harita (il sınırları + isimler)</button>
      </div>
    </div>
    <div class="option-group">
      <label class="group-title">2) Soru grubu seç</label>
      <div class="pill-row" id="familyPills">
        <button class="pill family-pill active" data-group="transport">📍 Geçitler &amp; Sınır Kapıları</button>
        <button class="pill family-pill" data-group="natural">🏔️ Göl, Dağ, Ova &amp; Baraj</button>
        <button class="pill family-pill" data-group="pipelines">🛢️ Petrol &amp; Doğalgaz Hatları</button>
      </div>
    </div>
    <div class="option-group">
      <label class="group-title">3) Konu seç</label>
      <div class="pill-row" id="categoryPills"></div>
    </div>
    <div class="option-group">
      <label class="group-title">4) Oyun modu seç</label>
      <div class="pill-row" id="modePills"></div>
    </div>
    <button class="big-btn" id="startBtn">Oyuna Başla</button>
    <button class="secondary-btn" id="refBtn">📖 Önce Konuları Görüntüle (Bilgi Kartları)</button>
    <button class="note-btn" id="noteBtn">💌 Sana Özel Bir Not</button>
    <div class="legend" id="legendBox"></div>
  </div>

  <!-- GAME SCREEN -->
  <div id="gameScreen" class="hidden">
    <div class="game-header">
      <div class="score-box">✅ <span id="scoreVal">0</span> / <span id="totalVal">0</span></div>
      <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
      <button class="quit-btn" id="quitBtn" title="Baştan başla">✕</button>
    </div>

    <div class="question-banner" id="questionBanner"></div>
    <div class="question-hint" id="questionHint"></div>

    <div class="map-wrap">
      <svg id="mapSvg" viewBox="0 0 920 400" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>

    <div id="optionsGrid" class="options-grid hidden"></div>

    <div id="feedbackCard" class="card feedback-card hidden">
      <div class="feedback-icon" id="feedbackIcon"></div>
      <div style="flex:1;">
        <p class="feedback-title" id="feedbackTitle"></p>
        <p class="feedback-text" id="feedbackText"></p>
        <p class="feedback-route hidden" id="feedbackRoute"></p>
        <div id="streakBanner" class="streak-banner hidden"></div>
        <button class="big-btn continue-btn" id="continueBtn">Devam Et →</button>
      </div>
    </div>
  </div>

  <!-- END SCREEN -->
  <div id="endScreen" class="card hidden">
    <div class="confetti-wrap" id="confettiWrap"></div>
    <div class="result-score" id="finalScore">0/0</div>
    <div class="result-sub" id="finalMsg"></div>
    <p class="motivation-line" id="endCareLine"></p>
    <div id="reviewWrap"></div>
    <button class="big-btn" id="playAgainBtn">Tekrar Oyna</button>
    <button class="secondary-btn" id="backHomeBtn">Ana Menüye Dön</button>
  </div>
</div>

<!-- REFERENCE MODAL -->
<div id="refModal" class="modal-overlay hidden">
  <div class="modal-box">
    <h2>📖 Konu Özeti</h2>
    <div id="refContent"></div>
    <button class="close-modal" id="closeRefBtn">Kapat</button>
  </div>
</div>

<!-- PERSONAL NOTE MODAL -->
<div id="noteModal" class="modal-overlay hidden">
  <div class="modal-box note-modal-box">
    <div class="note-heart">💙</div>
    <div id="noteText" class="note-text"></div>
    <button class="close-modal" id="closeNoteBtn">Kapat</button>
  </div>
</div>

<!-- QUIT CONFIRM MODAL -->
<div id="quitModal" class="modal-overlay hidden">
  <div class="modal-box" style="text-align:center;">
    <h2 style="margin-top:0;">Ana menüye dönmek istiyor musun?</h2>
    <p style="color:#6b5f4f;font-size:14.5px;margin-bottom:4px;">Bu oyundaki ilerlemen sıfırlanacak.</p>
    <button class="big-btn" id="quitConfirmYes">Evet, ana menüye dön</button>
    <button class="secondary-btn" id="quitConfirmNo">Vazgeç, devam et</button>
  </div>
</div>

/* ================= HELPERS ================= */
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function pointItemsByCat(cat){
  if(cat==='all'){
    const cats = GROUP_CONFIG[state.group].cats;
    return POINT_ITEMS.filter(i=>cats.includes(i.cat));
  }
  return POINT_ITEMS.filter(i=>i.cat===cat);
}
function pipelineItemsByCat(cat){
  return cat==='all' ? PIPELINES.slice() : PIPELINES.filter(i=>i.group===cat);
}
function currentPool(cat){
  return state.family==='points' ? pointItemsByCat(cat) : pipelineItemsByCat(cat);
}
const POINT_CAT_META = {
  tunnel:   {label:'Tünel / Geçit',  tag:'tag-tunnel'},
  border:   {label:'Sınır Kapısı',   tag:'tag-border'},
  lake:     {label:'Göl',            tag:'tag-lake'},
  mountain: {label:'Dağ',            tag:'tag-mountain'},
  plain:    {label:'Ova',            tag:'tag-plain'},
  dam:      {label:'Baraj',          tag:'tag-dam'}
};
function catLabel(item){
  if(state.family==='points') return POINT_CAT_META[item.cat].label;
  return item.group==='oil' ? 'Petrol Hattı' : 'Doğalgaz Hattı';
}
function catTagClass(item){
  if(state.family==='points') return POINT_CAT_META[item.cat].tag;
  return item.group==='oil' ? 'tag-oil' : 'tag-gas';
}
function distractorPool(item){
  if(state.family==='points') return POINT_ITEMS.filter(i=>i.cat===item.cat && i.id!==item.id);
  return PIPELINES.filter(i=>i.group===item.group && i.id!==item.id);
}

function startGame(){
  const pool = currentPool(state.category);
  state.queue = shuffle(pool);
  state.index = 0;
  state.score = 0;
  state.streak = 0;
  state.wrongList = [];
  document.getElementById('totalVal').textContent = state.queue.length;
  showScreen('game');
  nextQuestion();
}

function ringToPath(ring){
  return 'M ' + ring.map(p=>p[0]+','+p[1]).join(' L ') + ' Z';
}
function renderMapBase(){
  const svg = document.getElementById('mapSvg');
  svg.innerHTML = '';
  const ns = 'http://www.w3.org/2000/svg';

  if(state.mapStyle === 'plain'){
    const pathData = OUTLINE_XY.map(ringToPath).join(' ');
    const path = document.createElementNS(ns,'path');
    path.setAttribute('d', pathData);
    path.setAttribute('class','tr-shape');
    svg.appendChild(path);
    return;
  }

  if(state.mapStyle === 'political'){
    const sea = document.createElementNS(ns,'rect');
    sea.setAttribute('x',0); sea.setAttribute('y',0);
    sea.setAttribute('width',920); sea.setAttribute('height',400);
    sea.setAttribute('class','sea-bg');
    svg.appendChild(sea);

    NEIGHBORS_XY.forEach(nb=>{
      nb.rings.forEach(ring=>{
        const path = document.createElementNS(ns,'path');
        path.setAttribute('d', ringToPath(ring));
        path.setAttribute('class','neighbor-shape');
        svg.appendChild(path);
      });
    });

    PROVINCES_XY.forEach((pr, i)=>{
      const path = document.createElementNS(ns,'path');
      path.setAttribute('d', ringToPath(pr.pts));
      path.setAttribute('class','province-shape');
      path.setAttribute('fill', PROVINCE_PALETTE[i % PROVINCE_PALETTE.length]);
      svg.appendChild(path);
    });
    const outerPath = document.createElementNS(ns,'path');
    outerPath.setAttribute('d', OUTLINE_XY.map(ringToPath).join(' '));
    outerPath.setAttribute('class','tr-outline-strong');
    svg.appendChild(outerPath);
    return;
  }

  if(state.mapStyle === 'political_labeled'){
    PROVINCES_XY.forEach((pr, i)=>{
      const path = document.createElementNS(ns,'path');
      path.setAttribute('d', ringToPath(pr.pts));
      path.setAttribute('class','province-shape-colored');
      path.setAttribute('fill', PROVINCE_PALETTE[i % PROVINCE_PALETTE.length]);
      svg.appendChild(path);
    });
    const outerPath = document.createElementNS(ns,'path');
    outerPath.setAttribute('d', OUTLINE_XY.map(ringToPath).join(' '));
    outerPath.setAttribute('class','tr-outline-strong');
    svg.appendChild(outerPath);
    PROVINCES_XY.forEach(pr=>{
      const t = document.createElementNS(ns,'text');
      t.setAttribute('x', pr.lx); t.setAttribute('y', pr.ly);
      t.setAttribute('class','province-label');
      t.textContent = pr.n;
      svg.appendChild(t);
    });
  }
}

function nextQuestion(){
  state.answered = false;
  document.getElementById('feedbackCard').classList.add('hidden');
  document.getElementById('feedbackRoute').classList.add('hidden');
  document.getElementById('streakBanner').classList.add('hidden');
  document.getElementById('optionsGrid').classList.add('hidden');
  document.getElementById('optionsGrid').innerHTML='';

  renderMapBase();

  const pct = (state.index / state.queue.length) * 100;
  document.getElementById('progressBar').style.width = pct+'%';
  document.getElementById('scoreVal').textContent = state.score;

  if(state.index >= state.queue.length){ finishGame(); return; }

  const item = state.queue[state.index];
  const banner = document.getElementById('questionBanner');
  const hint = document.getElementById('questionHint');

  if(state.family==='points'){
    if(state.mode==='locate'){
      banner.innerHTML = `Bu yer haritada nerede? <b>${item.name}</b><span class="cat-tag ${catTagClass(item)}">${catLabel(item)}</span>`;
      hint.textContent = 'Haritada olduğunu düşündüğün yere dokun.';
      attachLocateHandlerPoint(item);
    } else {
      banner.innerHTML = `İşaretli yer neresi?<span class="cat-tag ${catTagClass(item)}">${catLabel(item)}</span>`;
      hint.textContent = 'Yanıp sönen noktanın ismini aşağıdan seç.';
      drawPulsingPoint(item);
      renderOptions(item);
    }
  } else {
    if(state.mode==='locate'){
      banner.innerHTML = `Bu hat haritada hangisi? <b>${item.name}</b><span class="cat-tag ${catTagClass(item)}">${catLabel(item)}</span>`;
      hint.textContent = 'Haritadaki hatlardan doğru olduğunu düşündüğüne dokun.';
      drawAllPipelinesFaint();
      attachLocateHandlerPipeline(item);
    } else {
      banner.innerHTML = `Işıklı ve akan hat hangisi?<span class="cat-tag ${catTagClass(item)}">${catLabel(item)}</span>`;
      hint.textContent = 'Diğer hatlar soluk gösteriliyor. Doğru ismi aşağıdan seç.';
      drawAllPipelinesFaint();
      drawActivePipeline(item, item.color, true);
      renderOptions(item);
    }
  }
}

/* ---------- POINT MODE: Haritada Bul ---------- */
function attachLocateHandlerPoint(item){
  const svg = document.getElementById('mapSvg');
  function handler(evt){
    if(state.answered) return;
    const pt = svg.createSVGPoint();
    const touch = evt.touches && evt.touches.length ? evt.touches[0] : evt;
    pt.x = touch.clientX; pt.y = touch.clientY;
    const ctm = svg.getScreenCTM().inverse();
    const svgP = pt.matrixTransform(ctm);
    handlePointLocateAnswer(item, svgP.x, svgP.y);
  }
  svg.addEventListener('click', handler, {once:true});
  svg.addEventListener('touchstart', handler, {once:true});
}
function handlePointLocateAnswer(item, tapX, tapY){
  state.answered = true;
  const dist = Math.hypot(tapX-item.x, tapY-item.y);
  const tolerance = 40;
  const isCorrect = dist <= tolerance;
  registerAnswer(isCorrect, item);
  drawStaticMarker(item.x, item.y, item.cat, isCorrect ? 'correct-mark':'');
  if(!isCorrect) drawTapX(tapX, tapY);
  showFeedback(isCorrect, item);
}
function drawTapX(x,y){
  const ns='http://www.w3.org/2000/svg';
  const svg = document.getElementById('mapSvg');
  const g = document.createElementNS(ns,'g');
  g.setAttribute('class','tap-x');
  const l1 = document.createElementNS(ns,'line');
  l1.setAttribute('x1',x-9); l1.setAttribute('y1',y-9); l1.setAttribute('x2',x+9); l1.setAttribute('y2',y+9);
  const l2 = document.createElementNS(ns,'line');
  l2.setAttribute('x1',x-9); l2.setAttribute('y1',y+9); l2.setAttribute('x2',x+9); l2.setAttribute('y2',y-9);
  g.appendChild(l1); g.appendChild(l2);
  svg.appendChild(g);
}
function drawPulsingPoint(item){
  const ns='http://www.w3.org/2000/svg';
  const svg = document.getElementById('mapSvg');
  const g = document.createElementNS(ns,'g');
  g.setAttribute('class','marker '+item.cat);
  const outer = document.createElementNS(ns,'circle');
  outer.setAttribute('class','dot-outer pulse');
  outer.setAttribute('cx', item.x); outer.setAttribute('cy', item.y); outer.setAttribute('r', 9);
  const inner = document.createElementNS(ns,'circle');
  inner.setAttribute('class','dot-inner');
  inner.setAttribute('cx', item.x); inner.setAttribute('cy', item.y); inner.setAttribute('r', 8);
  g.appendChild(outer); g.appendChild(inner);
  svg.appendChild(g);
}
function drawStaticMarker(x,y,cat,extraClass){
  const ns='http://www.w3.org/2000/svg';
  const svg = document.getElementById('mapSvg');
  const g = document.createElementNS(ns,'g');
  g.setAttribute('class','marker '+cat+' '+(extraClass||''));
  const inner = document.createElementNS(ns,'circle');
  inner.setAttribute('class','dot-inner');
  inner.setAttribute('cx', x); inner.setAttribute('cy', y); inner.setAttribute('r', 9);
  g.appendChild(inner);
  svg.appendChild(g);
}

/* ---------- PIPELINE MODE: drawing ---------- */
function polylinePoints(pts){ return pts.map(p=>p.x.toFixed(1)+','+p.y.toFixed(1)).join(' '); }

function drawAllPipelinesFaint(){
  const ns='http://www.w3.org/2000/svg';
  const svg = document.getElementById('mapSvg');
  const pool = pipelineItemsByCat(state.category);
  pool.forEach(p=>{
    const poly = document.createElementNS(ns,'polyline');
    poly.setAttribute('points', polylinePoints(p.pts));
    poly.setAttribute('class','pipe-line pipe-faint');
    poly.setAttribute('stroke', p.color);
    poly.setAttribute('data-id', p.id);
    svg.appendChild(poly);
    p.pts.forEach(pt=>{
      const c = document.createElementNS(ns,'circle');
      c.setAttribute('cx',pt.x); c.setAttribute('cy',pt.y); c.setAttribute('r',3);
      c.setAttribute('fill',p.color); c.setAttribute('class','pipe-node'); c.setAttribute('opacity','0.5');
      svg.appendChild(c);
    });
  });
}
function drawActivePipeline(item, colorOverride, animate){
  const ns='http://www.w3.org/2000/svg';
  const svg = document.getElementById('mapSvg');
  // remove the faint version of this line so the active one draws on top cleanly
  const faint = svg.querySelector(`polyline[data-id="${item.id}"]`);
  if(faint) faint.remove();
  const poly = document.createElementNS(ns,'polyline');
  poly.setAttribute('points', polylinePoints(item.pts));
  poly.setAttribute('class','pipe-line pipe-active'+(animate?' pipe-flow':''));
  poly.setAttribute('stroke', colorOverride || item.color);
  svg.appendChild(poly);
  item.pts.forEach(pt=>{
    const c = document.createElementNS(ns,'circle');
    c.setAttribute('cx',pt.x); c.setAttribute('cy',pt.y); c.setAttribute('r',4.5);
    c.setAttribute('fill', colorOverride || item.color); c.setAttribute('class','pipe-node');
    svg.appendChild(c);
  });
}

function distToSegment(px,py,ax,ay,bx,by){
  const dx=bx-ax, dy=by-ay;
  const len2 = dx*dx+dy*dy;
  let t = len2===0 ? 0 : ((px-ax)*dx+(py-ay)*dy)/len2;
  t = Math.max(0, Math.min(1, t));
  const cx = ax+t*dx, cy = ay+t*dy;
  return Math.hypot(px-cx, py-cy);
}
function nearestPipeline(tapX, tapY){
  const pool = pipelineItemsByCat(state.category);
  let best = null, bestDist = Infinity;
  pool.forEach(p=>{
    for(let i=0;i<p.pts.length-1;i++){
      const d = distToSegment(tapX,tapY, p.pts[i].x,p.pts[i].y, p.pts[i+1].x,p.pts[i+1].y);
      if(d<bestDist){ bestDist=d; best=p; }
    }
  });
  return {pipeline:best, dist:bestDist};
}

function attachLocateHandlerPipeline(item){
  const svg = document.getElementById('mapSvg');
  function handler(evt){
    if(state.answered) return;
    const pt = svg.createSVGPoint();
    const touch = evt.touches && evt.touches.length ? evt.touches[0] : evt;
    pt.x = touch.clientX; pt.y = touch.clientY;
    const ctm = svg.getScreenCTM().inverse();
    const svgP = pt.matrixTransform(ctm);
    handlePipelineLocateAnswer(item, svgP.x, svgP.y);
  }
  svg.addEventListener('click', handler, {once:true});
  svg.addEventListener('touchstart', handler, {once:true});
}
function handlePipelineLocateAnswer(item, tapX, tapY){
  state.answered = true;
  const tolerance = 16;
  const nearest = nearestPipeline(tapX, tapY);
  const isCorrect = nearest.pipeline && nearest.pipeline.id === item.id && nearest.dist <= tolerance;
  registerAnswer(isCorrect, item);

  drawActivePipeline(item, '#2f8f4e', false);
  if(!isCorrect && nearest.pipeline && nearest.dist <= tolerance+10){
    drawActivePipeline(nearest.pipeline, '#c81e2c', false);
  }
  let extraMsg = '';
  if(!isCorrect){
    extraMsg = (nearest.pipeline && nearest.dist<=tolerance+10)
      ? `Dokunduğun hat: ${nearest.pipeline.name}.`
      : 'Boş bir alana dokundun.';
  }
  showFeedback(isCorrect, item, extraMsg);
}

/* ---------- IDENTIFY MODE (shared options) ---------- */
function renderOptions(item){
  const grid = document.getElementById('optionsGrid');
  grid.classList.remove('hidden');
  grid.innerHTML='';
  const pool = distractorPool(item);
  const distractors = shuffle(pool).slice(0,3);
  const options = shuffle([item, ...distractors]);

  options.forEach(opt=>{
    const btn = document.createElement('button');
    btn.className='opt-btn';
    btn.textContent = opt.name;
    btn.addEventListener('click', ()=>{
      if(state.answered) return;
      state.answered = true;
      const isCorrect = opt.id === item.id;
      registerAnswer(isCorrect, item);

      Array.from(grid.children).forEach(b=>{
        b.disabled = true;
        if(b.textContent === item.name) b.classList.add('correct');
        else if(b === btn) b.classList.add('wrong');
      });

      if(state.family==='points'){
        drawStaticMarker(item.x, item.y, item.cat, isCorrect?'correct-mark':'wrong-mark');
      } else {
        drawActivePipeline(item, isCorrect ? '#2f8f4e' : '#c81e2c', false);
      }
      showFeedback(isCorrect, item);
    });
    grid.appendChild(btn);
  });
}

/* ---------- FEEDBACK ---------- */

  'Doğru! 🎉','Süpersin! ✅','İşte bu! 💪','Tam isabet! 🎯','Harikasın! 🌟',
  'Coğrafya senden korkuyor 😄','Bir soru daha çöktü! 🙌','Aferin! Bir çay molasını hak ettin ☕',
  'Bravo! Bu gidişle KPSS senden çok korkacak 😎','Süper, gözlerin harita gibi keskin 👀'
];
const WRONG_TITLES = [
  'Olsun, bir dahaki sefere 💙','Bu sefer olmadı ama artık biliyorsun 📌',
  'Haritalar bazen şaşırtır 😅','Fena değil, tekrar tekrar öğrenilir 🌱',
  'Kafan mı karıştı? Normal, 81 il var 😄','Bir sonrakinde yakalarsın 💪'
];
const STREAK_MESSAGES = [
  {min:3, max:4, text:'🔥 3 doğru üst üste! Seri devam ediyor'},
  {min:5, max:7, text:'🔥🔥 5\'te 5! Bu gidişle durdurulamıyorsun'},
  {min:8, max:9, text:'🔥🔥🔥 8 doğru üst üste! Efsanevi bir seri'},
  {min:10, max:9999, text:'🏆 10+ seri! KPSS coğrafyasının kraliçesisin'}
];

function registerAnswer(isCorrect, item){
  if(isCorrect){
    state.score++;
    state.streak++;
  } else {
    state.wrongList.push(item);
    state.streak = 0;
  }
}

function showFeedback(isCorrect, item, extraMsg){
  const card = document.getElementById('feedbackCard');
  card.classList.remove('hidden','ok','bad');
  card.classList.add(isCorrect?'ok':'bad');
  document.getElementById('feedbackIcon').textContent = isCorrect ? '✅' : '❌';
  let title;
  if(isCorrect){
    title = CORRECT_TITLES[Math.floor(Math.random()*CORRECT_TITLES.length)];
  } else {
    const base = WRONG_TITLES[Math.floor(Math.random()*WRONG_TITLES.length)];
    title = `${base} — Doğru cevap: ${item.name}`;
  }
  document.getElementById('feedbackTitle').textContent = title;
  document.getElementById('feedbackText').textContent = (extraMsg? extraMsg+' ' : '') + item.info;
  const routeEl = document.getElementById('feedbackRoute');
  if(state.family==='pipelines'){
    routeEl.textContent = 'Güzergâh: ' + item.routeText;
    routeEl.classList.remove('hidden');
  } else {
    routeEl.classList.add('hidden');
  }
  const streakEl = document.getElementById('streakBanner');
  const streakMsg = isCorrect ? STREAK_MESSAGES.find(s=>state.streak>=s.min && state.streak<=s.max) : null;
  if(streakMsg){
    streakEl.textContent = streakMsg.text;
    streakEl.classList.remove('hidden');
  } else {
    streakEl.classList.add('hidden');
  }
  document.getElementById('scoreVal').textContent = state.score;
}
document.getElementById('continueBtn').addEventListener('click', ()=>{
  state.index++;
  nextQuestion();
});

  'Mükemmel! Hepsi doğru 🎉 Bugün form senden yana!',

  'Süper bir sonuç! Birkaç tanesine bir göz at yeter 🌟',
  'Bu skorla gayet iyi yoldasın, devam! 🚀'
];
const END_MESSAGES_50 = [
  'Fena değil! Tekrar ettikçe daha da netleşecek 🌱',
  'Yolun yarısından fazlası tamam, devam edelim 👍',
  'İyi bir başlangıç, tekrarla bu sayı hızla yükselir 📈'
];

  'İlk denemede herkes böyle başlar, sorun değil 🌿',

];

  'Bu süreçte gösterdiğin emek gerçekten çok değerli. Devam et, gurur duyuyorum. 💙',
  'Ne kadar çalışırsan çalış, bu yolda yalnız değilsin. İyi gidiyorsun. 🌟',

];

function launchConfetti(){
  const wrap = document.getElementById('confettiWrap');
  wrap.innerHTML = '';
  const emojis = ['🎉','✨','🎊','💙','⭐'];
  for(let i=0;i<24;i++){
    const span = document.createElement('span');
    span.className = 'confetti-piece';
    span.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    span.style.left = (Math.random()*100)+'%';
    span.style.animationDelay = (Math.random()*0.6)+'s';
    span.style.fontSize = (14+Math.random()*14)+'px';
    wrap.appendChild(span);
  }
  setTimeout(()=>{ wrap.innerHTML=''; }, 3000);
}

function finishGame(){
  showScreen('end');
  const total = state.queue.length;
  document.getElementById('finalScore').textContent = `${state.score}/${total}`;
  const pct = Math.round((state.score/total)*100);
  let pool;
  if(pct===100) pool = END_MESSAGES_100;
  else if(pct>=80) pool = END_MESSAGES_80;
  else if(pct>=50) pool = END_MESSAGES_50;
  else pool = END_MESSAGES_LOW;
  const msg = pool[Math.floor(Math.random()*pool.length)];
  document.getElementById('finalMsg').textContent = `${msg} (%${pct})`;
  document.getElementById('endCareLine').textContent =
    CARE_LINES[Math.floor(Math.random()*CARE_LINES.length)];

  if(pct===100) launchConfetti();

  const reviewWrap = document.getElementById('reviewWrap');
  reviewWrap.innerHTML = '';
  if(state.wrongList.length){
    const title = document.createElement('div');
    title.className='ref-section-title';
    title.textContent = 'Tekrar Etmen Gerekenler';
    reviewWrap.appendChild(title);
    const list = document.createElement('div');
    list.className='review-list';
    state.wrongList.forEach(it=>{
      const div = document.createElement('div');
      div.className='review-item';
      div.innerHTML = `<span><b>${it.name}</b> — ${it.info}</span>`;
      list.appendChild(div);
    });
    reviewWrap.appendChild(list);
  }
}
